[versions]
mod-version = "7.19.0"

# Java / Minecraft
jdk = "25"
minecraft = "26.2"
fabric-loader = "0.19.3"

# Fabric Loom
loom = "1.17-SNAPSHOT"

# Meteor Client
meteor = "26.2-SNAPSHOT"

# Tooling / test libraries
reflections = "0.10.2"
javassist = "3.28.0-GA"   # required by Reflections' class scanning; bundled via jar-in-jar
jqwik = "1.8.5"
# 0.8.14 is the first release that officially supports Java 25 class files; 0.8.12
# throws "Unsupported class file major version 69" while instrumenting the test JVM.
jacoco = "0.8.14"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }
reflections = { module = "org.reflections:reflections", version.ref = "reflections" }
javassist = { module = "org.javassist:javassist", version.ref = "javassist" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
