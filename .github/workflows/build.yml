name: Build Venomous

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: venomous-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Prepare release JAR
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(grep '^mod-version' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"

          if [[ -z "$JAR" ]]; then
            echo "No release JAR found in build/libs"
            exit 1
          fi

          mkdir -p release
          cp "$JAR" "release/Venomous-${VERSION}.jar"

          echo "Prepared release/Venomous-${VERSION}.jar"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: Venomous-${{ github.sha }}
          path: release/Venomous-*.jar
          if-no-files-found: error
          retention-days: 30

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release JAR
        uses: actions/download-artifact@v7
        with:
          name: Venomous-${{ github.sha }}
          path: release

      - name: Publish Nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find release -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          DATE="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NIGHTLY_JAR="release/Venomous-nightly-${DATE}+${SHORT_SHA}.jar"

          mv "$JAR" "$NIGHTLY_JAR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi

          gh release create nightly "$NIGHTLY_JAR" \
            --title "Venomous Nightly" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automated nightly build from main.

          Commit: ${GITHUB_SHA}
          Build date: ${DATE} UTC"

  publish-stable:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release JAR
        uses: actions/download-artifact@v7
        with:
          name: Venomous-${{ github.sha }}
          path: release

      - name: Publish Stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep '^mod-version' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          JAR="release/Venomous-${TAG_VERSION}.jar"

          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match project version $PROJECT_VERSION."
            exit 1
          fi

          if [[ ! -f "$JAR" ]]; then
            echo "Expected $JAR but it was not produced."
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$JAR" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$JAR" \
              --title "Venomous ${TAG_VERSION}" \
              --generate-notes
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f stable "$GITHUB_SHA"
          git push origin refs/tags/stable --force