name: Build Venomous

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: venomous-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Venomous-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download JAR
        uses: actions/download-artifact@v7
        with:
          name: Venomous-${{ github.sha }}
          path: release

      - name: Publish Nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find release -maxdepth 1 -type f -name "*.jar" | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "No JAR found."
            exit 1
          fi

          BASE="$(basename "$JAR" .jar)"
          VERSION="${BASE#venomous-}"
          DATE="$(date -u +%Y.%m.%d)"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NIGHTLY_JAR="release/Venomous-${VERSION}-nightly-${DATE}+${SHORT_SHA}.jar"
          mv "$JAR" "$NIGHTLY_JAR"

          NIGHTLY_TAG="nightly-${DATE}-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${NIGHTLY_TAG}"

          gh release create "$NIGHTLY_TAG" "$NIGHTLY_JAR" \
            --title "Venomous Nightly (${VERSION} - ${DATE} ${SHORT_SHA})" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automated nightly build from main.

Commit: ${GITHUB_SHA}
Build date: ${DATE} UTC
Nightly tag: ${NIGHTLY_TAG}"

  publish-stable:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download JAR
        uses: actions/download-artifact@v7
        with:
          name: Venomous-${{ github.sha }}
          path: release

      - name: Publish Stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          JAR="$(find release -maxdepth 1 -type f -name "*.jar" | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "No JAR found."
            exit 1
          fi

          STABLE_JAR="release/Venomous-${VERSION}.jar"
          mv "$JAR" "$STABLE_JAR"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$STABLE_JAR" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$STABLE_JAR" \
              --title "Venomous ${VERSION}" \
              --generate-notes
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f stable "$GITHUB_SHA"
          git push origin refs/tags/stable --force
