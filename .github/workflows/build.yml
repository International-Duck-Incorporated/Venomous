name: Build Venomous

on:
  # Manual runs only: this workflow never triggers automatically on pushes
  # (including version tags) or pull requests. Trigger it from the
  # Actions tab -> "Build Venomous" -> "Run workflow".
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release after building"
        type: choice
        options:
          - none
          - nightly
          - stable
        default: none
      version:
        description: "Stable release version (required for 'stable', e.g. 1.2.3)"
        required: false
        default: ""

concurrency:
  group: venomous-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Reject broken module files
        run: |
          if find src -name "*.broken" | grep -q .; then
            echo "::error::*.broken files detected in src/ - delete or finish them before building."
            find src -name "*.broken"
            exit 1
          fi

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Test and coverage
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Generate module documentation
        run: ./gradlew generateModulesDoc --no-daemon

      - name: Check module documentation is current
        run: git diff --exit-code -- docs/MODULES.md

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Venomous-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml

  publish-nightly:
    if: inputs.release == 'nightly'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: Venomous-${{ github.sha }}
          path: release

      - name: Publish Nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find release -maxdepth 1 -type f -name "*.jar" | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "No JAR found."
            exit 1
          fi

          BASE="$(basename "$JAR" .jar)"
          VERSION="${BASE#venomous-}"
          DATE="$(date -u +%Y.%m.%d)"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NIGHTLY_JAR="release/Venomous-${VERSION}-nightly-${DATE}+${SHORT_SHA}.jar"
          mv "$JAR" "$NIGHTLY_JAR"

          NIGHTLY_TAG="nightly-${DATE}-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${NIGHTLY_TAG}"

          gh release create "$NIGHTLY_TAG" "$NIGHTLY_JAR" \
            --title "Venomous Nightly (${VERSION} - ${DATE} ${SHORT_SHA})" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automated nightly build from main.

          Commit: ${GITHUB_SHA}
          Build date: ${DATE} UTC
          Nightly tag: ${NIGHTLY_TAG}"

  publish-stable:
    if: inputs.release == 'stable'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: Venomous-${{ github.sha }}
          path: release

      - name: Publish Stable
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: the 'version' input is required for a stable release."
            exit 1
          fi

          JAR="$(find release -maxdepth 1 -type f -name "*.jar" | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "No JAR found."
            exit 1
          fi

          STABLE_JAR="release/Venomous-${VERSION}.jar"
          mv "$JAR" "$STABLE_JAR"

          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Point the release tag at the commit being built.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$STABLE_JAR" --clobber
          else
            gh release create "$TAG" "$STABLE_JAR" \
              --title "Venomous ${VERSION}" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

          git tag -f stable "$GITHUB_SHA"
          git push origin refs/tags/stable --force
